# 公司 ATS 招聘看板清单。
#
# 这是配置，不是代码 —— 想盯哪家公司直接在这里加一行。
# 三家 ATS 都有免费公开 API，无需认证，一家公司一次请求。
#
# 怎么找 board 名：
#   Ashby       https://jobs.ashbyhq.com/<board>          -> board = "<board>"
#   Lever       https://jobs.lever.co/<company>           -> board = "<company>"
#   Greenhouse  https://boards.greenhouse.io/<token>      -> board = "<token>"
#
# 验证某个 board 是否存在（返回 200 且有岗位即可用）：
#   curl -s "https://api.ashbyhq.com/posting-api/job-board/<board>" | head -c 200
#   curl -s "https://api.lever.co/v0/postings/<company>?mode=json" | head -c 200
#   curl -s "https://boards-api.greenhouse.io/v1/boards/<token>/jobs" | head -c 200

[[boards]]
ats = "ashby"
board = "allium"
company = "Allium"
note = "链上数据基础设施，客户含 Visa/Stripe/Coinbase；Blockchain Data Wizard 无硬性年限门槛"

