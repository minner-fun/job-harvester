[project]
name = "job-harvester"
version = "0.3.0"
description = "多源岗位采集器：产出标准化岗位记录，不涉及存储"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "python-dotenv>=1.0",
    "selectolax>=0.3.21",
]

[project.scripts]
harvest = "job_harvester.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_harvester"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 每个源的用例都是异步的，逐个挂 @pytest.mark.asyncio 只是噪声
asyncio_mode = "auto"
# 让用例能 `from conftest import ...` 拿到 FakeFetcher
pythonpath = ["tests"]
